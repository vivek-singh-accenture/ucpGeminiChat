<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyword Config — UCP Gemini Chat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --surface: #f0f4f9;
    --border: #dadce0;
    --text: #1f1f1f;
    --text-secondary: #5f6368;
    --blue: #1a73e8;
    --blue-light: #e8f0fe;
    --green: #188038;
    --red: #d93025;
    --radius: 12px;
  }

  body {
    font-family: 'Google Sans', 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-logo { font-size: 18px; font-weight: 500; color: var(--text); }
  .header-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent;
    font-size: 14px; color: var(--text); cursor: pointer;
    text-decoration: none; font-family: inherit;
  }
  .back-btn:hover { background: var(--surface); }

  /* ── Main ── */
  .main {
    max-width: 800px;
    margin: 32px auto;
    padding: 0 24px;
  }

  h2 { font-size: 20px; font-weight: 500; margin-bottom: 20px; }

  /* ── Form ── */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 28px;
  }
  .form-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 16px; }
  .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .form-row label { font-size: 13px; color: var(--text-secondary); }
  .form-row input {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .form-row input:focus { border-color: var(--blue); }
  .form-hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .form-actions { display: flex; gap: 8px; }
  .btn {
    padding: 9px 18px; border-radius: 20px; border: none;
    font-size: 14px; font-family: inherit; cursor: pointer;
    font-weight: 500;
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary {
    background: transparent; color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--surface); }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; padding: 10px 12px;
    border-bottom: 2px solid var(--border);
    font-size: 13px; color: var(--text-secondary); font-weight: 500;
  }
  td { padding: 12px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface); }

  .keywords-cell { display: flex; flex-wrap: wrap; gap: 4px; }
  .kw-tag {
    display: inline-block; padding: 2px 8px;
    background: var(--blue-light); color: var(--blue);
    border-radius: 12px; font-size: 12px;
  }
  .url-cell { word-break: break-all; color: var(--blue); }
  .date-cell { color: var(--text-secondary); white-space: nowrap; font-size: 13px; }
  .actions-cell { display: flex; gap: 8px; white-space: nowrap; }
  .action-btn {
    padding: 4px 12px; border-radius: 14px; border: 1px solid var(--border);
    background: transparent; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .action-btn:hover { background: var(--surface); }
  .action-btn.delete { color: var(--red); border-color: var(--red); }
  .action-btn.delete:hover { background: #fce8e6; }

  .empty-state {
    text-align: center; padding: 40px 0;
    color: var(--text-secondary); font-size: 15px;
  }

  /* ── Banner ── */
  .banner {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 8px;
    font-size: 14px; font-weight: 500;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: opacity 0.3s;
    z-index: 999;
  }
  .banner.success { background: #e6f4ea; color: var(--green); }
  .banner.error { background: #fce8e6; color: var(--red); }
  .banner.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <defs>
        <linearGradient id="logoGrad2" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#4285f4"/>
          <stop offset="50%" stop-color="#9c4dcc"/>
          <stop offset="100%" stop-color="#ea4335"/>
        </linearGradient>
      </defs>
      <circle cx="14" cy="14" r="12" fill="url(#logoGrad2)" opacity="0.15"/>
      <circle cx="14" cy="14" r="5" fill="url(#logoGrad2)"/>
    </svg>
    <div>
      <div class="header-logo">Keyword → URL Config</div>
      <div class="header-subtitle">UCP Gemini Chat · Demo Configuration</div>
    </div>
  </div>
  <a href="/" class="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Back to Chat
  </a>
</header>

<div class="main">
  <div class="form-card">
    <h3 id="formTitle">Add New Mapping</h3>
    <form id="mappingForm" onsubmit="handleSubmit(event)">
      <input type="hidden" id="editId" value="">
      <div class="form-row">
        <label for="keywordsInput">Keywords (comma-separated)</label>
        <input type="text" id="keywordsInput" placeholder="samsung, galaxy, s25" required>
        <span class="form-hint">When any keyword appears in a user message, the UCP journey auto-starts for the URL below.</span>
      </div>
      <div class="form-row">
        <label for="urlInput">Merchant URL</label>
        <input type="text" id="urlInput" placeholder="http://localhost:8080" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" class="btn btn-secondary" id="cancelBtn" onclick="cancelEdit()" style="display:none;">Cancel</button>
      </div>
    </form>
  </div>

  <h2>Current Mappings</h2>
  <div class="table-wrap">
    <table id="mappingsTable">
      <thead>
        <tr>
          <th>Keywords</th>
          <th>URL</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="mappingsBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">No mappings yet. Add one above.</div>
  </div>
</div>

<div id="banner" class="banner hidden"></div>

<script>
  async function loadMappings() {
    const res = await fetch('/api/config/mappings');
    const mappings = await res.json();
    const tbody = document.getElementById('mappingsBody');
    const empty = document.getElementById('emptyState');
    tbody.innerHTML = '';
    if (!mappings.length) {
      empty.style.display = 'block';
      document.getElementById('mappingsTable').querySelector('thead').style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    document.getElementById('mappingsTable').querySelector('thead').style.display = '';
    for (const m of mappings) {
      const date = new Date(m.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      const kws = m.keywords.map(k => `<span class="kw-tag">${escHtml(k)}</span>`).join('');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><div class="keywords-cell">${kws}</div></td>
        <td class="url-cell">${escHtml(m.url)}</td>
        <td class="date-cell">${date}</td>
        <td class="actions-cell">
          <button class="action-btn" onclick="startEdit('${escAttr(m.id)}', ${JSON.stringify(m.keywords)}, '${escAttr(m.url)}')">Edit</button>
          <button class="action-btn delete" onclick="deleteMapping('${escAttr(m.id)}')">Delete</button>
        </td>`;
      tbody.appendChild(tr);
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) {
    return s.replace(/'/g, "\\'");
  }

  function startEdit(id, keywords, url) {
    document.getElementById('editId').value = id;
    document.getElementById('keywordsInput').value = keywords.join(', ');
    document.getElementById('urlInput').value = url;
    document.getElementById('formTitle').textContent = 'Edit Mapping';
    document.getElementById('cancelBtn').style.display = '';
    document.getElementById('keywordsInput').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    document.getElementById('editId').value = '';
    document.getElementById('mappingForm').reset();
    document.getElementById('formTitle').textContent = 'Add New Mapping';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const keywords = document.getElementById('keywordsInput').value.split(',').map(k => k.trim()).filter(Boolean);
    const url = document.getElementById('urlInput').value.trim();

    if (!keywords.length) { showBanner('Enter at least one keyword.', true); return; }
    if (!url) { showBanner('Enter a URL.', true); return; }

    const body = { keywords, url };
    const method = id ? 'PUT' : 'POST';
    const path = id ? `/api/config/mappings/${id}` : '/api/config/mappings';

    try {
      const res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        showBanner(err.detail || 'Error saving mapping.', true);
        return;
      }
      cancelEdit();
      await loadMappings();
      showBanner(id ? 'Mapping updated.' : 'Mapping added.', false);
    } catch {
      showBanner('Network error.', true);
    }
  }

  async function deleteMapping(id) {
    if (!confirm('Delete this mapping?')) return;
    const res = await fetch(`/api/config/mappings/${id}`, { method: 'DELETE' });
    if (res.ok || res.status === 204) {
      await loadMappings();
      showBanner('Mapping deleted.', false);
    } else {
      showBanner('Could not delete mapping.', true);
    }
  }

  function showBanner(msg, isError) {
    const el = document.getElementById('banner');
    el.textContent = msg;
    el.className = 'banner ' + (isError ? 'error' : 'success');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = 'banner hidden'; }, 3000);
  }

  loadMappings();
</script>
</body>
</html>
